<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="calm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- faint circuit lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <circle cx="60" cy="90" r="3" fill="#334155"/>
    <circle cx="1140" cy="560" r="3" fill="#334155"/>
  </g>

  <!-- kicker + title -->
  <text x="80" y="130" font-family="Menlo, Consolas, monospace" font-size="20" fill="#2dd4bf" letter-spacing="3">AGENT ORCHESTRATION &#183; PART 1</text>
  <text x="78" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#f8fafc" font-weight="bold">The Graph Isn&#8217;t the Agent</text>
  <text x="80" y="240" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">why wiring a tool loop isn&#8217;t the same as building something smart</text>

  <!-- LEFT: tangled naive graph -->
  <g transform="translate(90,300)">
    <text x="0" y="-20" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#f87171" letter-spacing="1">NAIVE REACT LOOP</text>
    <g fill="none" stroke-width="2.5" opacity="0.9">
      <path d="M40,40 C120,-10 160,90 90,110 C20,130 130,180 180,120 C230,60 60,20 40,40" stroke="#f87171"/>
      <path d="M60,80 C140,140 40,160 90,200 C140,240 200,150 150,110" stroke="#fbbf24"/>
    </g>
    <circle cx="40" cy="40" r="16" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="180" cy="120" r="16" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="90" cy="200" r="16" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="150" cy="110" r="16" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="60" cy="80" r="10" fill="#f87171"/>
    <text x="0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">context growing, nobody steering</text>
  </g>

  <!-- middle arrow -->
  <g transform="translate(430,370)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="url(#teal)" stroke-width="4"/>
    <path d="M140,0 L120,-12 L120,12 Z" fill="#818cf8"/>
  </g>

  <!-- RIGHT: clean harness layers -->
  <g transform="translate(640,300)">
    <text x="0" y="-20" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4ade80" letter-spacing="1">AGENT HARNESS</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">
      <rect x="0" y="0" width="260" height="34" rx="8" fill="url(#calm)"/>
      <text x="14" y="22">Plan &amp; track tasks</text>

      <rect x="0" y="44" width="260" height="34" rx="8" fill="url(#calm)" opacity="0.9"/>
      <text x="14" y="66">Compact context</text>

      <rect x="0" y="88" width="260" height="34" rx="8" fill="url(#calm)" opacity="0.8"/>
      <text x="14" y="110">Sandbox tools</text>

      <rect x="0" y="132" width="260" height="34" rx="8" fill="url(#calm)" opacity="0.7"/>
      <text x="14" y="154">Isolate sub-agents</text>

      <rect x="0" y="176" width="260" height="34" rx="8" fill="url(#calm)" opacity="0.6"/>
      <text x="14" y="198">Persist state to disk</text>
    </g>
  </g>

  <text x="1080" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#475569" text-anchor="end">utkarshjoshi.com</text>
</svg>
