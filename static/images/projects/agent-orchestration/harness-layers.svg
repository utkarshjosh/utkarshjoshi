<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" rx="16" fill="url(#cardGrad2)"/>
  <text x="30" y="46" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#f8fafc" font-weight="bold">What a harness actually gives the loop</text>
  <text x="30" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">the model call in the middle barely changes &#8212; everything around it does</text>

  <!-- spine -->
  <line x1="450" y1="100" x2="450" y2="500" stroke="#334155" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- band template repeated -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- 1 -->
    <rect x="60" y="100" width="780" height="66" rx="12" fill="url(#band)" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="96" cy="133" r="16" fill="#052e16" stroke="#22c55e"/>
    <text x="96" y="138" font-size="14" fill="#4ade80" text-anchor="middle">1</text>
    <text x="130" y="128" font-size="16" fill="#f1f5f9" font-weight="bold">Plan &amp; track the task</text>
    <text x="130" y="149" font-size="13" fill="#94a3b8">a running todo list instead of hoping the model remembers the goal</text>

    <!-- 2 -->
    <rect x="60" y="178" width="780" height="66" rx="12" fill="url(#band)" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="96" cy="211" r="16" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="96" y="216" font-size="14" fill="#5eead4" text-anchor="middle">2</text>
    <text x="130" y="206" font-size="16" fill="#f1f5f9" font-weight="bold">Compact context on purpose</text>
    <text x="130" y="227" font-size="13" fill="#94a3b8">old tool output gets summarized or dropped before it chokes the window</text>

    <!-- 3 -->
    <rect x="60" y="256" width="780" height="66" rx="12" fill="url(#band)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="96" cy="289" r="16" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="96" y="294" font-size="14" fill="#c7d2fe" text-anchor="middle">3</text>
    <text x="130" y="284" font-size="16" fill="#f1f5f9" font-weight="bold">Sandbox and permission tools</text>
    <text x="130" y="305" font-size="13" fill="#94a3b8">a shell command isn't trusted the same as reading a file</text>

    <!-- 4 -->
    <rect x="60" y="334" width="780" height="66" rx="12" fill="url(#band)" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="96" cy="367" r="16" fill="#500724" stroke="#f472b6"/>
    <text x="96" y="372" font-size="14" fill="#fbcfe8" text-anchor="middle">4</text>
    <text x="130" y="362" font-size="16" fill="#f1f5f9" font-weight="bold">Spin up isolated sub-agents</text>
    <text x="130" y="383" font-size="13" fill="#94a3b8">a messy research detour happens in its own context, not the main thread</text>

    <!-- 5 -->
    <rect x="60" y="412" width="780" height="66" rx="12" fill="url(#band)" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="96" cy="445" r="16" fill="#451a03" stroke="#fbbf24"/>
    <text x="96" y="450" font-size="14" fill="#fde68a" text-anchor="middle">5</text>
    <text x="130" y="440" font-size="16" fill="#f1f5f9" font-weight="bold">Keep state somewhere durable</text>
    <text x="130" y="461" font-size="13" fill="#94a3b8">files and git commits outlive the chat &#8212; memory isn't a prompt anymore</text>
  </g>

  <text x="450" y="525" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">none of this is a new model. it's infrastructure the model gets to stand on.</text>
</svg>
